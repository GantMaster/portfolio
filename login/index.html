<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b10">
    <title>Управление портфолио — GantMaster</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="admin-shell">
        <header class="admin-topbar">
            <a class="admin-brand" href="../"><span>GantMaster</span><small>Portfolio CMS</small></a>
            <a class="back-link" href="../">← На сайт</a>
        </header>

        <section class="auth-panel" id="loginPanel">
            <p class="eyebrow">PRIVATE AREA</p>
            <h1>Вход в админку</h1>
            <p class="muted">Войдите с аккаунтом администратора Firebase.</p>
            <form id="loginForm">
                <label>Email<input name="email" type="email" autocomplete="username" required></label>
                <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
                <button class="primary-button" type="submit">Войти</button>
            </form>
            <p class="notice" id="loginMessage" role="status"></p>
        </section>

        <section class="editor-panel" id="editorPanel" hidden>
            <div class="editor-heading">
                <div>
                    <p class="eyebrow">CONTENT</p>
                    <h1>Контент портфолио</h1>
                    <p class="muted" id="userLabel"></p>
                </div>
                <button class="quiet-button" id="logoutButton" type="button">Выйти</button>
            </div>

            <div class="editor-toolbar">
                <span class="editor-help">Сохраните изменения, затем обновите страницу портфолио, чтобы увидеть результат.</span>
                <div class="toolbar-actions">
                    <button class="quiet-button" id="reloadButton" type="button">Обновить</button>
                    <button class="primary-button" id="saveButton" type="button">Сохранить</button>
                </div>
            </div>
            <p class="notice save-notice" id="saveMessage" role="status" aria-live="polite"></p>

            <nav class="editor-tabs" aria-label="Разделы редактора">
                <button type="button" class="editor-tab active" data-section="meta" aria-selected="true">Мета</button>
                <button type="button" class="editor-tab" data-section="content" aria-selected="false">Контент</button>
            </nav>

            <div id="editorContent" class="editor-content"></div>
        </section>
    </main>
    <script type="module" src="admin.js"></script>
</body>
</html>
